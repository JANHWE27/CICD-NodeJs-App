name: "CICD NodeJS Application"

on:
    push:
        branches: [ "main" ]

        paths-ignore:
            - 'README.md'

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v3

            - name: DockerHub Login
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build Dockerfile
              run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cicd-app:${{ github.sha }} .
            
            - name: Push to DockerHub
              run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/cicd-app:${{ github.sha }}
